<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a33"><title>Create your ZakiTech password</title>
<link rel="icon" href="assets/images/zakitech-mark.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#071a33;--panel:#0c2545;--cyan:#69e2f5;--text:#f4faff;--muted:#a9bfd5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 15%,#123c60 0,transparent 45%),linear-gradient(145deg,#06152b,#081f3c);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
.card{width:min(100%,460px);padding:clamp(24px,6vw,40px);border:1px solid #244867;border-radius:24px;background:rgba(12,37,69,.94);box-shadow:0 25px 70px #0005}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;letter-spacing:-.8px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#123d60;color:var(--cyan);font-weight:900}
h1{font-size:clamp(27px,5vw,34px);margin:26px 0 10px;letter-spacing:-1px}p{color:var(--muted);line-height:1.6}
label{display:block;margin:18px 0 8px;font-weight:650;font-size:14px}input{width:100%;padding:14px 15px;border:1px solid #315472;border-radius:12px;background:#071a33;color:white;font:inherit;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #69e2f522}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:linear-gradient(100deg,#22bad6,#69e2f5);color:#06203b;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.message{min-height:24px;font-size:14px;overflow-wrap:anywhere}.back{display:block;text-align:center;margin-top:18px;color:var(--cyan);text-decoration:none}.hint{font-size:13px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js" defer></script>
<script src="assets/js/supabase-config.js" defer></script>
<script src="assets/js/reset-password.js" defer></script>
</head>
<body><main class="card">
<div class="brand"><span class="mark">Z</span><span>Zaki<span style="color:var(--cyan)">Tech</span></span></div>
<h1>Create your password</h1>
<p>You're setting the password for your existing ZakiTech account. Open this page from the password-reset email sent to your account.</p>
<form id="resetForm">
<label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters">
<label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="Enter the same password again">
<p class="hint">Use a strong password you haven't used elsewhere. Don't share it with anyone.</p>
<p class="message" id="resetMessage" role="status" aria-live="polite"></p>
<button id="savePassword" type="submit">Save password</button>
</form><a class="back" href="./">Return to ZakiTech sign in</a>
</main></body></html>
