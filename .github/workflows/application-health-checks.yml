name: Daily application health checks
# Molan Business now deploys from its private repository through Cloudflare Pages.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  push:
    paths:
      - ".github/workflows/application-health-checks.yml"

permissions:
  contents: read

concurrency:
  group: daily-application-health-checks
  cancel-in-progress: false

jobs:
  check-applications:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Check registered ZakiTech applications
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all registered application endpoints
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          check_url() {
            name="$1"
            url="$2"
            code="$(curl --silent --show-error --location --retry 2 --max-time 30 -o /dev/null -w '%{http_code}' "$url")"
            curl_status=$?
            if [ "$curl_status" -ne 0 ] || [[ ! "$code" =~ ^2[0-9][0-9]$ && ! "$code" =~ ^3[0-9][0-9]$ ]]; then
              echo "::error title=$name health check failed::HTTP $code (curl exit $curl_status) at $url"
              echo "- ❌ $name: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            else
              echo "$name is reachable: HTTP $code"
              echo "- ✅ $name: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          check_url "ZakiTech platform" "https://zakpollyqueens.github.io/Zakitech/"
          check_url "ZakiTech infrastructure monitor" "https://zakpollyqueens.github.io/Zakitech/infrastructure-monitor.html"
          check_url "Molan Business application" "https://molan-business.pages.dev/"
          check_url "Molan Business profile overview" "https://molan-business.pages.dev/business-profiles/3d-printing-booking-agency/index.html"
          check_url "Molan Business dynamic feature route" "https://molan-business.pages.dev/business-profiles/3d-printing-booking-agency/pages/operations-service-jobs/index.html"
          check_url "Molan Business legacy feature route" "https://molan-business.pages.dev/business-profiles/3d-printing-equipment-hire/pages/3d-printing-operations/index.html"
          check_url "ZakiChat application" "https://zakpollyqueens.github.io/ZakiChat-/"
          check_url "Ranidd Online Mart application" "https://ranidd-online-shopping.zakpollyqueens.workers.dev/"
          if [ "$failures" -gt 0 ]; then
            echo "$failures application endpoint(s) failed."
            exit 1
          fi
          echo "All registered application endpoints are reachable."
