name: Build ZakiTech Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-apk-build
      - feat/zak-branding-live-refresh
    paths:
      - '**.html'
      - 'assets/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'assets/js/app-updater.js'
      - 'assets/css/app-updater.css'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled website
        shell: bash
        run: |
          mkdir -p www
          cp ./*.html ./manifest.json www/
          cp -R assets www/assets
          mkdir -p assets
          mkdir -p www/assets/js www/assets/css
          cp assets/js/app-updater.js www/assets/js/app-updater.js
          cp assets/css/app-updater.css www/assets/css/app-updater.css
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then BUILD_VERSION="v0.1.${GITHUB_RUN_NUMBER}"; else BUILD_VERSION="v0.1.0"; fi
          sed -i "s/__ZAKITECH_BUILD_VERSION__/${BUILD_VERSION}/g" www/assets/js/app-updater.js
          for page in www/*.html; do
            sed -i 's#</head>#  <link rel="stylesheet" href="assets/css/app-updater.css">\n</head>#i' "$page"
            sed -i 's#</body>#  <script src="assets/js/app-updater.js" defer></script>\n</body>#i' "$page"
          done
          # Bundle Supabase locally for Android WebView reliability; do not depend on a CDN at launch.
          SUPABASE_UMD="$(find node_modules/@supabase/supabase-js -type f \( -name 'supabase.min.js' -o -name 'supabase.js' \) -path '*/umd/*' -print -quit)"
          if [ -z "$SUPABASE_UMD" ]; then
            echo "Could not find the Supabase UMD browser bundle in the installed package."
            exit 1
          fi
          cp "$SUPABASE_UMD" www/assets/js/supabase.min.js
          for page in www/*.html; do
            sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js#assets/js/supabase.min.js#g' "$page"
          done
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('assets/images/zakitech-app-icon.svg')
            .resize(1024, 1024, { fit: 'contain', background: '#06152b' })
            .png()
            .toFile('assets/icon-only.png');
          await sharp('assets/images/zakitech-app-icon.svg')
            .resize(2732, 2732, { fit: 'contain', background: '#06152b' })
            .png()
            .toFile('assets/splash.png');
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync bundled web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZakiTech-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare public APK asset
        if: github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZakiTech.apk

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ZakiTech Android Release v0.1.${{ github.run_number }}
          body: |
            ZakiTech Android release v0.1.${{ github.run_number }}.

            Note: this workflow currently produces a debug-signed APK for testing. Android may reject in-place updates if the APK signing certificate differs from the installed build. Production signing must be configured before reliable in-place updates can be guaranteed.
          files: ZakiTech.apk
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
