name: Build ZakiTech Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-apk-build
    paths:
      - '**.html'
      - 'assets/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled website
        shell: bash
        run: |
          mkdir -p www
          cp ./*.html ./manifest.json www/
          cp -R assets www/assets
          mkdir -p assets
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('assets/images/zakitech-app-icon.svg')
            .resize(1024, 1024, { fit: 'contain', background: '#06152b' })
            .png()
            .toFile('assets/icon-only.png');
          await sharp('assets/images/zakitech-app-icon.svg')
            .resize(2732, 2732, { fit: 'contain', background: '#06152b' })
            .png()
            .toFile('assets/splash.png');
          NODE

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync bundled web app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZakiTech-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
