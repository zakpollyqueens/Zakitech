name: Supabase daily keepalive

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-daily-keepalive.yml"

permissions:
  contents: read

concurrency:
  group: supabase-daily-keepalive
  cancel-in-progress: false

jobs:
  database-heartbeats:
    name: Daily database activity checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep ZakiTech Supabase active
        env:
          SUPABASE_URL: https://mmozesoarwkimhyloivu.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Y3fCt1ZguDDK7iO5tN865g_JuFMrQkn
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/zakitech_keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{}')"
          jq -e 'type == "string" and length > 0' <<< "$response" >/dev/null
          printf 'ZakiTech database heartbeat confirmed: %s\n' "$(jq -r . <<< "$response")"

      - name: Keep Ranidd Online Mart Supabase active
        env:
          SUPABASE_URL: https://itpgyrsaseoozrkpbzew.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_rpcgjGTmhegAp1ulU7EQ7w_Shq1xFto
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/zakitech_keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{}')"
          jq -e 'type == "string" and length > 0' <<< "$response" >/dev/null
          printf 'Ranidd database heartbeat confirmed: %s\n' "$(jq -r . <<< "$response")"

      - name: Keep Molan Business Supabase active
        env:
          SUPABASE_URL: https://rcubnewrfieqhwcnvrzs.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0T7DCcWPMHr5sRGMUcc8sQ_8jnobyYQ
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/zakitech_keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{}')"
          jq -e 'type == "string" and length > 0' <<< "$response" >/dev/null
          printf 'Molan Business database heartbeat confirmed: %s\n' "$(jq -r . <<< "$response")"
