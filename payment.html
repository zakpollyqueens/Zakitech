<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Secure Checkout · ZakiTech</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#173452,#071426 60%);color:#f1f5f9;font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.wrap{max-width:720px;margin:35px auto}.brand{font-weight:900;letter-spacing:.08em;color:#fff;font-size:22px}.brand span{color:#43d6e8}.card{margin-top:22px;padding:26px;border:1px solid #29435d;border-radius:22px;background:rgba(10,24,41,.94);box-shadow:0 24px 80px #0005}.muted{color:#a8bbce}.tag{display:inline-block;padding:6px 11px;border-radius:30px;background:#183e4b;color:#8de8dc;font-size:12px;font-weight:800}.amount{font-size:36px;font-weight:900;letter-spacing:-1px;margin:10px 0 18px}.items{width:100%;border-collapse:collapse}.items td{padding:13px 0;border-bottom:1px solid #263c52}.items td:last-child{text-align:right;white-space:nowrap}.total{display:flex;justify-content:space-between;font-weight:850;font-size:20px;padding-top:18px}.pay{width:100%;border:0;border-radius:12px;padding:16px;margin-top:22px;background:linear-gradient(90deg,#25c7df,#6ce3cf);color:#052333;font-size:16px;font-weight:900;cursor:pointer}.pay:disabled{opacity:.5;cursor:not-allowed}.notice{margin-top:14px;padding:13px;border-radius:11px;background:#172d43;color:#b9cce0}.notice.err{background:#4b1e2b;color:#fecaca}.notice.ok{background:#104437;color:#a7f3d0}.foot{text-align:center;color:#8296aa;font-size:12px;margin-top:24px}
</style></head><body><main class="wrap"><div class="brand">ZAKI<span>TECH</span></div><section class="card"><span class="tag">SECURE PAYMENT REQUEST</span><h1 id="title">Loading your invoice…</h1><p class="muted" id="invoiceNo"></p><div id="invoiceBody"><p class="muted">Please wait while we retrieve the itemized invoice.</p></div><button id="payButton" class="pay" disabled>Continue to JumaPay checkout ↗</button><div id="notice" class="notice" role="status">Connecting securely…</div></section><div class="foot">ZakiTech · Equipping minds with IT solutions.<br>Payment confirmation is checked securely by the payment provider.</div></main><script>
(()=>{const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),token=params.get("invoice"),base="https://mmozesoarwkimhyloivu.supabase.co/functions/v1/zakitech-billing";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=(v,c)=>c+" "+Number(v||0).toLocaleString("en-US",{maximumFractionDigits:2});function notice(t,k=""){ $("notice").className="notice "+k;$("notice").textContent=t}async function load(){if(!token){notice("This invoice link is incomplete.","err");return}try{const r=await fetch(base+"?action=details&token="+encodeURIComponent(token));const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"Invoice unavailable.");const i=d.invoice;$("title").textContent=i.product_name;$("invoiceNo").textContent="Invoice "+i.invoice_number+" · Bill to "+i.customer_name;const rows=i.line_items.map(x=>'<tr><td>'+esc(x.description)+'<br><small class="muted">'+esc(x.quantity)+' × '+money(x.unit_price,i.currency)+'</small></td><td>'+money(x.line_total,i.currency)+'</td></tr>').join("");$("invoiceBody").innerHTML='<div class="amount">'+money(i.total_amount,i.currency)+'</div><table class="items"><tbody>'+rows+'</tbody></table><div class="total"><span>Total due</span><span>'+money(i.total_amount,i.currency)+'</span></div>'+(i.notes?'<p class="muted">'+esc(i.notes)+'</p>':'');if(i.status==="paid"){$("payButton").disabled=true;$("payButton").textContent="✓ Payment received";notice("This invoice has been paid. Thank you.","ok")}else if(i.status!=="pending"){$("payButton").disabled=true;$("payButton").textContent="Invoice "+i.status;notice("This invoice is "+i.status+". Contact ZakiTech if you need assistance.","err")}else{$("payButton").disabled=false;notice("Review the itemized costs above, then continue to secure JumaPay checkout.")}}catch(e){notice(e.message,"err");$("title").textContent="Invoice unavailable"}}$("payButton").onclick=async()=>{const b=$("payButton");b.disabled=true;b.textContent="Preparing secure checkout…";try{const r=await fetch(base+"?action=checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});const d=await r.json();if(!r.ok||d.error)throw Error(d.error||"Could not start payment.");if(!d.payment_url)throw Error("The payment provider did not return a checkout link.");location.href=d.payment_url}catch(e){notice(e.message,"err");b.disabled=false;b.textContent="Retry JumaPay checkout ↗"}};load()})();
</script></body></html>
